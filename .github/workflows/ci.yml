name: CI

on:
  push:
  pull_request:

# A second push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, test, eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          # package.json sets engines.node >= 20; 20 is the floor we support.
          node-version: 20
          cache: npm
          # Two lockfiles: the library's and the demo's. Both must contribute to
          # the cache key, or a demo-only dependency bump reuses a stale cache.
          cache-dependency-path: |
            package-lock.json
            examples/browser-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` now includes tests/fixtures.test.ts, which runs the detector
      # over the recorded guitar and fails if it gets WORSE than it is today.
      # Before that file existed, every test here was synthetic and the suite
      # could be green while the detector mis-heard the sample input.
      - name: Test
        run: npm test

      # Also asserts that dist/tuninator-worklet.js is self-contained (no imports),
      # via scripts/assert-worklet-bundle.mjs. This step MUST come before anything
      # in examples/browser-demo: the demo depends on the library through
      # "file:../.." and resolves `tuninator/web` through the package `exports`
      # map, i.e. through dist/. Without a prior build its `tsc --noEmit` fails
      # with TS2307 "Cannot find module 'tuninator/web'".
      - name: Build library
        run: npm run build

      - name: Demo — install dependencies
        working-directory: examples/browser-demo
        run: npm ci

      - name: Demo — typecheck
        working-directory: examples/browser-demo
        run: npx tsc --noEmit

      - name: Demo — test
        working-directory: examples/browser-demo
        run: npm test

      # vite.config.ts aliases `tuninator` / `tuninator/web` to the library's
      # source entry points and copies dist/tuninator-worklet.js into
      # public/assets/, so this consumes the build produced above.
      - name: Demo — build
        working-directory: examples/browser-demo
        run: npx vite build

      # `npm run eval` scores the detector against the fixtures' ASPIRATIONAL
      # thresholds in fixtures/eval.config.json. It still exits 1: clean-lead is
      # at 77.4% pitch class against a 90% gate, and power-chords misses its
      # onset budget. Those are open detector problems, not regressions.
      #
      # It stays non-blocking ONLY because the ratchet in tests/fixtures.test.ts
      # now guards the thing that matters day to day -- the detector cannot get
      # worse without `npm test` going red. Eval is the target; the test is the
      # floor. Drop `continue-on-error` when the targets are met.
      - name: Eval (target thresholds — non-blocking, see comment)
        continue-on-error: true
        run: npm run eval

      # Uploaded with always() so the report is available precisely when eval
      # failed, which is the case worth inspecting.
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: .cache/eval-report.json
          if-no-files-found: warn
